name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

# No paths-ignore: this is a required status check on main, so it must run for
# docs-only PRs too. Cost control is concurrency + the synchronize debounce.
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Debounce rapid pushes
        if: github.event.action == 'synchronize'
        run: sleep 90

      # The reviewer script always comes from the default branch, so a PR
      # cannot rewrite the code that runs with ANTHROPIC_API_KEY.
      - name: Checkout reviewer (default branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: reviewer
          persist-credentials: false

      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr_number }}/head
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Staff Eng review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEW_REPO_ROOT: ${{ github.workspace }}/pr
        run: python3 reviewer/scripts/pr-review/review.py --pr "$PR_NUMBER"
